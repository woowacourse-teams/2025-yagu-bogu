name: YaguBogu KMP CI

on:
  push:
    branches: [ "dev-an" ]
    paths: [ "mobile/**" ]
  pull_request:
    branches: [ "dev-an" ]
    paths: [ "mobile/**" ]
  workflow_dispatch:

env:
  GOOGLE_SERVICES_JSON_FULL: ${{ secrets.GOOGLE_SERVICES_JSON_FULL }}
  IOS_CONFIG_XCCONFIG: ${{ secrets.IOS_CONFIG_XCCONFIG }}

jobs:
  lint-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle  # Gradle 의존성 캐시
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Create google-services.json
        run: |
          mkdir -p ./composeApp
          echo "$GOOGLE_SERVICES_JSON_FULL" | base64 --decode > ./composeApp/google-services.json
      - name: Run ktlint check
        run: ./gradlew ktlintCheck

  android-build:
    needs: lint-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle  # Gradle 의존성 캐시

      # Gradle 빌드 캐시 (증분 빌드 결과물)
      # ~/.gradle/caches/build-cache에 태스크 출력물을 저장해
      # 소스 변경이 없는 모듈은 재컴파일 없이 캐시에서 복원됨
      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache
          key: ${{ runner.os }}-gradle-build-${{ hashFiles('mobile/**/*.kt', 'mobile/**/*.kts') }}
          restore-keys: ${{ runner.os }}-gradle-build-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        run: |
          mkdir -p ./composeApp
          echo "$GOOGLE_SERVICES_JSON_FULL" | base64 --decode > ./composeApp/google-services.json

      - name: Android Build
        run: |
          ./gradlew :composeApp:assembleDebug

  ios-build:
    needs: lint-check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle  # Gradle 의존성 캐시

      # Kotlin/Native 컴파일러 캐시
      # KMP iOS 빌드 시 Kotlin/Native 툴체인이 여기에 다운로드됨
      # libs.versions.toml 해시 기반 → Kotlin 버전 변경 시 자동 갱신
      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      # SPM checkout만 캐시한다. DerivedData 전체를 복원하면 이전 빌드 산출물이
      # Xcode/Kotlin 프레임워크 복사 단계와 충돌하거나 디스크를 과도하게 사용한다.
      - name: Cache SPM source packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore iOS Config.xcconfig
        run: |
          mkdir -p iosApp/Configuration
          echo "$IOS_CONFIG_XCCONFIG" | base64 --decode > iosApp/Configuration/Config.xcconfig

      - name: Resolve Xcode Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: iOS Build Test
        run: |
          ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Xcode Project Build Check
        run: |
          rm -rf composeApp/build/xcode-frameworks
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
