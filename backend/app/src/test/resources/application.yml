spring:
  profiles:
    active: integration
  flyway:
    enabled: false

oauth:
  google:
    base-uri: 'https://oauth2.googleapis.com'
    token-info-uri: '/tokeninfo'
    client-id: 'this-is-client-id'
    connect-timeout: 180s # 3분
    read-timeout: 180s
  apple:
    issuer: 'https://appleid.apple.com'
    jwks-uri: 'https://appleid.apple.com/auth/keys'
    client-id: 'com.example.app'

admin:
  oauth:
    google:
      client-id: 'admin-google-client-id'

security:
  token:
    access-token:
      secret-key: this-is-secret-key
      expires-in: 900      # 15분 (초)
    refresh-token:
      secret-key: this-is-secret-key
      expires-in: 1209600  # 14일 (초)

api:
  kbo:
    base-url: https://www.koreabaseball.com/ws
    connect-timeout: 5s
    read-timeout: 30s
    content-type: application/x-www-form-urlencoded; charset=UTF-8

kbo:
  crawler:
    navigation-timeout: 7s
    table-timeout: 3s
    wait-timeout: 3s
    max-retries: 1
    retry-delay: 500ms
    context-pool-size: 2

    # 셀렉터
    date-field-selector: "#cphContents_cphContents_cphContents_hfSearchDate"
    date-label-selector: "#cphContents_cphContents_cphContents_lblGameDate"
    update-panel-selector: "#cphContents_cphContents_cphContents_udpRecord"
    score-selector: ".smsScore"

    # WebForms 포스트백 타겟
    event-target: "ctl00$ctl00$ctl00$cphContents$cphContents$cphContents$btnCalendarSelect"

    runner:
      enabled: false
      schedule-type: "regular"

sse:
  heartbeat:
    enabled: true
    interval-ms: 25000

tour:
  api:
    service-key: test-service-key
    base-url: https://apis.data.go.kr/B551011/KorService2
    radius: 1000
    num-of-rows: 50
    request-interval: 0ms
    connect-timeout: 10s
    read-timeout: 30s

app:
  s3:
    bucket: yagubogu
    check-in-private-bucket: yagubogu-check-in-image-private
    presign-expiration: 10m
    endpoint: https://test-account.r2.cloudflarestorage.com
    region: auto
    public-base-url: https://images.yagubogu.com
    default-profile-image-url: https://images.yagubogu.com/images/defaults/profile.png
    check-in-access-key-id: test-check-in-access-key
    check-in-secret-access-key: test-check-in-secret-key
  clock:
    fixed-date: 2024-08-15

---
spring:
  config:
    activate:
      on-profile: e2e

---
spring:
  config:
    activate:
      on-profile: integration

---
spring:
  config:
    activate:
      on-profile: integration-mysql
