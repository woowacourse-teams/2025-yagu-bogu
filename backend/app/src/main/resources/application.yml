spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/migration/mysql
    validate-on-migrate: true

  datasource:
    hikari:
      maximumPoolSize: 18
      minimumIdle: 18
      connectionTimeout: 5000
      idleTimeout: 0
      maxLifetime: 1500000
      validationTimeout: 1000
      poolName: main-hikari-pool

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200
      thread-name-prefix: app-async-

server:
  tomcat:
    threads:
      max: 80
      min-spare: 16
    accept-count: 200

oauth:
  google:
    base-uri: 'https://oauth2.googleapis.com'
    token-info-uri: '/tokeninfo'
    client-id: ${GOOGLE_CLIENT_ID}
    connect-timeout: 180s
    read-timeout: 180s
  apple:
    issuer: 'https://appleid.apple.com'
    jwks-uri: 'https://appleid.apple.com/auth/keys'
    client-id: ${APPLE_CLIENT_ID}

admin:
  oauth:
    google:
      client-id: ${ADMIN_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}}
  crawling:
    base-url: ${CRAWLING_BASE_URL:http://localhost:8081}
    connect-timeout: 5s
    read-timeout: 180s

security:
  token:
    access-token:
      secret-key: ${ACCESS_TOKEN_SECRET_KEY}
      expires-in: 900      # 15분 (초)
    refresh-token:
      secret-key: ${REFRESH_TOKEN_SECRET_KEY}
      expires-in: 1209600  # 14일 (초)

api:
  kbo:
    base-url: https://www.koreabaseball.com/ws
    connect-timeout: 5s
    read-timeout: 30s
    content-type: application/x-www-form-urlencoded; charset=UTF-8

tour:
  api:
    # 공공데이터포털에서 발급받은 디코딩된(Decoded) 서비스키를 사용하세요. (이중 인코딩 방지)
    service-key: ${TOUR_API_SERVICE_KEY}
    base-url: https://apis.data.go.kr/B551011/KorService2
    radius: 10000       # 구장 중심으로부터 반경 (미터)
    num-of-rows: 50     # 한 번에 가져올 최대 결과 수
    request-interval: 100ms # 요청 간 최소 간격 (초당 요청 제한 대응, 100ms = 초당 10건)
    connect-timeout: 10s
    read-timeout: 30s

sse:
  heartbeat:
    enabled: true
    interval-ms: 25000

app:
  s3:
    bucket: ${R2_S3_BUCKET}
    presign-expiration: 5m
    endpoint: ${R2_S3_ENDPOINT}
    region: ${R2_REGION:auto}
    public-base-url: ${R2_PUBLIC_BASE_URL:https://images.yagubogu.com}
    default-profile-image-url: ${R2_DEFAULT_PROFILE_IMAGE_URL:${app.s3.public-base-url}/images/defaults/profile.png}

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: prod
